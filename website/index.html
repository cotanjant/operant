<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operant Chat</title>
  <meta name="description" content="Chat with Operant, an agentic native AI model served by a pure-Rust inference engine.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
            },
            accent: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glow-radial {
      background: radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12), transparent 70%);
    }
    #chat-messages::-webkit-scrollbar { width: 8px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col selection:bg-brand-500 selection:text-white">
  <div class="fixed inset-0 glow-radial pointer-events-none z-0"></div>

  <!-- Header -->
  <header class="relative z-10 border-b border-white/10 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-500 to-accent-500 flex items-center justify-center font-bold text-white text-sm">O</div>
        <span class="text-lg font-bold tracking-tight text-white">OPERANT</span>
        <span class="text-xs px-2 py-0.5 rounded-full font-mono bg-brand-500/10 text-brand-400 border border-brand-500/20">chat</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-xs font-mono bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
          <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="api-status-text" class="text-slate-300">Checking API...</span>
        </div>
        <a href="landing.html" class="text-xs font-medium text-slate-400 hover:text-white transition">About &rarr;</a>
      </div>
    </div>
  </header>

  <!-- Messages -->
  <main class="relative z-10 flex-1 overflow-hidden">
    <div class="max-w-4xl mx-auto h-full flex flex-col px-4 py-4">
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-1">
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-brand-500/20 text-brand-400 border border-brand-500/30 flex items-center justify-center font-bold text-sm shrink-0">O</div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-sm p-4 text-sm text-slate-200 max-w-2xl leading-relaxed">
            Hello! I am <strong>Operant</strong>, an agentic native model for planning, tool execution, and code synthesis. What do you want to work on?
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Composer -->
  <footer class="relative z-10 border-t border-white/10 bg-slate-950/80 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2 pb-2 text-xs font-mono">
        <label class="flex items-center gap-2">
          <span class="text-slate-500">Endpoint:</span>
          <input id="api-endpoint" type="text" value="http://localhost:8000" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-slate-200 focus:outline-none focus:border-brand-500 w-44">
        </label>
        <label class="flex items-center gap-2">
          <span class="text-slate-500">Temp:</span>
          <input id="api-temp" type="number" step="0.1" min="0" max="1" value="0.7" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-slate-200 w-14">
        </label>
        <button id="btn-recheck-api" class="text-brand-400 hover:text-brand-300 underline">Retry</button>
        <button id="clear-chat" class="ml-auto px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Clear Chat</button>
      </div>
      <form id="chat-form" class="flex gap-3">
        <input id="chat-input" type="text" placeholder="Message Operant..." autocomplete="off" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
        <button type="submit" id="btn-send" class="px-5 py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-slate-950 font-semibold text-sm transition flex items-center gap-2 shrink-0">
          <span>Send</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
        </button>
      </form>
      <div class="flex items-center gap-2 pt-2 text-xs text-slate-500">
        <span>Try:</span>
        <button type="button" class="quick-prompt hover:text-brand-400 underline" data-prompt="What is the Operant architecture?">Architecture</button> &bull;
        <button type="button" class="quick-prompt hover:text-brand-400 underline" data-prompt="Plan an autonomous bug fix workflow in Rust.">Bug Fix Plan</button> &bull;
        <button type="button" class="quick-prompt hover:text-brand-400 underline" data-prompt="Who are you?">Who are you?</button>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
